# Prefixes: Ctrl-j is the primary prefix and Ctrl-f is the alternate.
set -g prefix C-j
set -g prefix2 C-f
unbind C-b
bind-key C-j send-prefix

# Sensible defaults.
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"
set -g escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g display-time 2000
set -g status-interval 5
set -g repeat-time 600
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#I:#W"
set -g set-clipboard on

# Keep new panes in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Use vi keys in copy mode and keep the selection in the system clipboard.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# Easy config reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# Mouse support.
set -g mouse on

# Use Alt-Arrow keys without the prefix to switch panes.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-Arrow switches windows.
bind -n S-Left previous-window
bind -n S-Right next-window

# Ctrl-Shift-Arrow reorders windows.
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Synchronize panes.
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

# Session persistence.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR"

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# TPM is optional at config-parse time, so tmux remains usable before plugins
# are installed. Install it with the command in README.md, then press Prefix+I.
if-shell -b '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'display-message "TPM is not installed; see README.md"'
